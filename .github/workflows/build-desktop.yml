name: build-desktop

on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      require_windows_signing:
        description: Fail when the Windows signing certificate is unavailable
        required: false
        type: boolean
        default: false
    secrets:
      WINDOWS_CERTIFICATE_BASE64:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for Vitest
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: macos-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for Electron Forge
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # MakerDMG -> electron-installer-dmg -> appdmg uses host-side native
      # addons which Bun does not compile automatically for this tool chain.
      - name: Build native DMG-maker addons
        run: |
          for pkg in macos-alias fs-xattr; do
            pushd "node_modules/$pkg"
            bunx node-gyp rebuild --python="$(command -v python3)"
            popd
          done

      - name: Build DMG
        working-directory: apps/desktop
        run: >-
          bunx electron-forge make --platform=darwin --arch=${{ matrix.arch }}
          --targets @electron-forge/maker-dmg

      - name: Name installer
        id: installer
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION=$(bun -p "require('./apps/desktop/package.json').version")
          SHORT_SHA=${GITHUB_SHA::7}
          SOURCE=$(find apps/desktop/out/make -type f -name '*.dmg' -print -quit)
          if [ -z "$SOURCE" ]; then
            echo "No DMG was produced" >&2
            exit 1
          fi
          mkdir -p release-assets
          ASSET="Pine-${VERSION}+${SHORT_SHA}-darwin-${ARCH}.dmg"
          mv "$SOURCE" "release-assets/$ASSET"
          echo "name=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pine-darwin-${{ matrix.arch }}-${{ github.sha }}
          path: release-assets/${{ steps.installer.outputs.name }}
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for Electron Forge
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure Windows signing
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          REQUIRE_SIGNING: ${{ inputs.require_windows_signing || false }}
        run: |
          if ($env:REQUIRE_SIGNING -eq "true" -and ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD))) {
            throw "A Windows signing certificate and password are required for release builds"
          }
          if (-not [string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) {
            $certificatePath = Join-Path $env:RUNNER_TEMP "pine-code-signing.pfx"
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
            "WINDOWS_CERTIFICATE_FILE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Build Squirrel installer
        working-directory: apps/desktop
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: >-
          bunx electron-forge make --platform=win32 --arch=x64
          --targets @electron-forge/maker-squirrel

      - name: Verify packaged runtime and launch
        shell: pwsh
        run: |
          $package = Get-ChildItem "apps/desktop/out" -Directory -Filter "Pine-win32-x64" | Select-Object -First 1
          if (-not $package) { throw "Packaged Windows app was not produced" }
          $sandboxRuntime = Join-Path $package.FullName "resources/app/node_modules/@anthropic-ai/sandbox-runtime/vendor/srt-win/x64/srt-win.exe"
          if (-not (Test-Path $sandboxRuntime)) { throw "The Windows sandbox helper is missing from the package" }
          $process = Start-Process -FilePath (Join-Path $package.FullName "Pine.exe") -ArgumentList "--smoke-test" -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            throw "The packaged Windows app did not finish its smoke test"
          }
          if ($process.ExitCode -ne 0) { throw "The packaged Windows app exited with code $($process.ExitCode)" }

      - name: Stage Windows update assets
        id: installer
        shell: pwsh
        run: |
          $version = bun -p "require('./apps/desktop/package.json').version"
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $makeDirectory = "apps/desktop/out/make/squirrel.windows/x64"
          $setup = Get-ChildItem $makeDirectory -File -Filter "*.exe" | Select-Object -First 1
          $package = Get-ChildItem $makeDirectory -File -Filter "*.nupkg" | Select-Object -First 1
          $releases = Join-Path $makeDirectory "RELEASES"
          if (-not $setup -or -not $package -or -not (Test-Path $releases)) {
            throw "Squirrel update assets are incomplete"
          }
          New-Item -ItemType Directory -Path "release-assets" -Force | Out-Null
          $asset = "Pine-$version+$shortSha-win32-x64.exe"
          Copy-Item $setup.FullName (Join-Path "release-assets" $asset)
          Copy-Item $package.FullName "release-assets"
          Copy-Item $releases "release-assets"
          "name=$asset" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pine-win32-x64-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
