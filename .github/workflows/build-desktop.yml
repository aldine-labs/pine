name: build-desktop

on:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for Vitest
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check

  build:
    name: Build macOS ${{ matrix.arch }}
    runs-on: macos-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for Electron Forge
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # MakerDMG -> electron-installer-dmg -> appdmg uses host-side native
      # addons which Bun does not compile automatically for this tool chain.
      - name: Build native DMG-maker addons
        run: |
          for pkg in macos-alias fs-xattr; do
            pushd "node_modules/$pkg"
            bunx node-gyp rebuild --python="$(command -v python3)"
            popd
          done

      - name: Build DMG
        working-directory: apps/desktop
        run: >-
          bunx electron-forge make --platform=darwin --arch=${{ matrix.arch }}
          --targets @electron-forge/maker-dmg

      - name: Name installer
        id: installer
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION=$(bun -p "require('./apps/desktop/package.json').version")
          SHORT_SHA=${GITHUB_SHA::7}
          SOURCE=$(find apps/desktop/out/make -type f -name '*.dmg' -print -quit)
          if [ -z "$SOURCE" ]; then
            echo "No DMG was produced" >&2
            exit 1
          fi
          mkdir -p release-assets
          ASSET="Pine-${VERSION}+${SHORT_SHA}-darwin-${ARCH}.dmg"
          mv "$SOURCE" "release-assets/$ASSET"
          echo "name=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pine-${{ matrix.arch }}-${{ github.sha }}
          path: release-assets/${{ steps.installer.outputs.name }}
          if-no-files-found: error
          retention-days: 14
