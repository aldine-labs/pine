name: release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  precheck:
    name: Release precheck
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      short_sha: ${{ steps.metadata.outputs.short_sha }}
      notes_file: ${{ steps.metadata.outputs.notes_file }}
      changelog_file: ${{ steps.metadata.outputs.changelog_file }}
      r2_enabled: ${{ steps.metadata.outputs.r2_enabled }}
      r2_account_id: ${{ steps.metadata.outputs.r2_account_id }}
      r2_bucket: ${{ steps.metadata.outputs.r2_bucket }}
      r2_prefix: ${{ steps.metadata.outputs.r2_prefix }}
      r2_public_base_url: ${{ steps.metadata.outputs.r2_public_base_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Read existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --paginate --slurp
          "repos/${GITHUB_REPOSITORY}/releases?per_page=100"
          > "$RUNNER_TEMP/releases.json"

      - name: Validate version and CHANGELOG
        id: metadata
        env:
          RELEASES_FILE: ${{ runner.temp }}/releases.json
        run: bun apps/desktop/scripts/prepare-release.mjs

      - name: Validate R2 credentials
        if: steps.metadata.outputs.r2_enabled == 'true'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "R2 is enabled, but R2_ACCESS_KEY_ID or R2_SECRET_ACCESS_KEY is missing" >&2
            exit 1
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ steps.metadata.outputs.version }}
          path: |
            ${{ steps.metadata.outputs.notes_file }}
            ${{ steps.metadata.outputs.changelog_file }}
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build release installers
    needs: precheck
    uses: ./.github/workflows/build-desktop.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      require_windows_signing: true

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - precheck
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: pine-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes-${{ needs.precheck.outputs.version }}
          path: release-metadata

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Generate checksums
        env:
          ASSETS_DIRECTORY: release-assets
        run: bun apps/desktop/scripts/create-checksums.mjs

      - name: Generate R2 update manifest
        if: needs.precheck.outputs.r2_enabled == 'true'
        env:
          ASSETS_DIRECTORY: release-assets
          CHANGELOG_FILE: release-metadata/release-changelog.md
          INTERNAL_VERSION: ${{ needs.precheck.outputs.short_sha }}
          R2_PREFIX: ${{ needs.precheck.outputs.r2_prefix }}
          R2_PUBLIC_BASE_URL: ${{ needs.precheck.outputs.r2_public_base_url }}
          RELEASE_VERSION: ${{ needs.precheck.outputs.version }}
        run: bun apps/desktop/scripts/create-update-manifest.mjs

      - name: Upload latest installers to R2
        if: needs.precheck.outputs.r2_enabled == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ needs.precheck.outputs.r2_account_id }}
          R2_BUCKET: ${{ needs.precheck.outputs.r2_bucket }}
          R2_PREFIX: ${{ needs.precheck.outputs.r2_prefix }}
          VERSION: ${{ needs.precheck.outputs.version }}
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          for ARCH in arm64 x64; do
            SOURCE=$(find release-assets -type f -name "*-darwin-${ARCH}.dmg" -print -quit)
            if [ -z "$SOURCE" ]; then
              echo "Missing ${ARCH} installer" >&2
              exit 1
            fi
            NAME=$(basename "$SOURCE")
            aws s3 cp "$SOURCE" \
              "s3://${R2_BUCKET}/${R2_PREFIX}releases/v${VERSION}/${NAME}" \
              --endpoint-url "$ENDPOINT" --no-progress \
              --content-type application/x-apple-diskimage \
              --cache-control "public,max-age=31536000,immutable"
            aws s3 cp "$SOURCE" \
              "s3://${R2_BUCKET}/${R2_PREFIX}latest/Pine-darwin-${ARCH}.dmg" \
              --endpoint-url "$ENDPOINT" --no-progress \
              --content-type application/x-apple-diskimage \
              --cache-control "no-cache,max-age=0,must-revalidate"
          done
          WINDOWS_SETUP=$(find release-assets -type f -name "*-win32-x64.exe" -print -quit)
          WINDOWS_PACKAGE=$(find release-assets -type f -name "*.nupkg" -print -quit)
          if [ -z "$WINDOWS_SETUP" ] || [ -z "$WINDOWS_PACKAGE" ] || [ ! -f release-assets/RELEASES ]; then
            echo "Missing Windows Squirrel update assets" >&2
            exit 1
          fi
          WINDOWS_SETUP_NAME=$(basename "$WINDOWS_SETUP")
          WINDOWS_PACKAGE_NAME=$(basename "$WINDOWS_PACKAGE")
          aws s3 cp "$WINDOWS_SETUP" \
            "s3://${R2_BUCKET}/${R2_PREFIX}releases/v${VERSION}/${WINDOWS_SETUP_NAME}" \
            --endpoint-url "$ENDPOINT" --no-progress \
            --content-type application/vnd.microsoft.portable-executable \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp "$WINDOWS_SETUP" \
            "s3://${R2_BUCKET}/${R2_PREFIX}latest/Pine-win32-x64.exe" \
            --endpoint-url "$ENDPOINT" --no-progress \
            --content-type application/vnd.microsoft.portable-executable \
            --cache-control "no-cache,max-age=0,must-revalidate"
          aws s3 cp "$WINDOWS_PACKAGE" \
            "s3://${R2_BUCKET}/${R2_PREFIX}latest/win32-x64/${WINDOWS_PACKAGE_NAME}" \
            --endpoint-url "$ENDPOINT" --no-progress \
            --content-type application/octet-stream \
            --cache-control "no-cache,max-age=0,must-revalidate"
          aws s3 cp release-assets/RELEASES \
            "s3://${R2_BUCKET}/${R2_PREFIX}latest/win32-x64/RELEASES" \
            --endpoint-url "$ENDPOINT" --no-progress \
            --content-type text/plain \
            --cache-control "no-store,max-age=0"
          aws s3 cp release-assets/SHA256SUMS \
            "s3://${R2_BUCKET}/${R2_PREFIX}latest/SHA256SUMS" \
            --endpoint-url "$ENDPOINT" --no-progress \
            --content-type text/plain \
            --cache-control "no-cache,max-age=0,must-revalidate"
          aws s3 cp release-assets/update.json \
            "s3://${R2_BUCKET}/${R2_PREFIX}latest/update.json" \
            --endpoint-url "$ENDPOINT" --no-progress \
            --content-type application/json \
            --cache-control "no-store,max-age=0"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.precheck.outputs.tag }}
          VERSION: ${{ needs.precheck.outputs.version }}
        run: >-
          gh release create "$TAG"
          release-assets/*.dmg release-assets/*.exe release-assets/*.nupkg
          release-assets/RELEASES release-assets/SHA256SUMS
          --target "$GITHUB_SHA"
          --title "Pine ${VERSION}"
          --notes-file release-metadata/release-notes.md
